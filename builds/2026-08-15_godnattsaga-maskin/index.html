<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Godnattsaga-maskin · The Goodnight Story Machine</title>
<style>
  :root{
    --ink:#eaf0ff; --ink-dim:#a9b6d8; --gold:#ffd884; --rose:#ffb3c6;
    --card:rgba(20,26,54,.72); --edge:rgba(255,255,255,.10);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
    color:var(--ink);
    background:
      radial-gradient(1200px 700px at 80% -10%, #2a2050 0%, transparent 60%),
      radial-gradient(900px 600px at 10% 110%, #14304a 0%, transparent 55%),
      linear-gradient(160deg,#0a0c22 0%, #0e1330 45%, #0b1226 100%);
    min-height:100vh; overflow-x:hidden;
  }
  /* stars */
  #sky{position:fixed; inset:0; z-index:0; pointer-events:none}
  .star{position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    opacity:.7; animation:tw var(--d,4s) ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.15; transform:scale(.7)} to{opacity:.95; transform:scale(1.25)}}
  .moon{position:fixed; top:34px; right:44px; width:74px; height:74px; border-radius:50%;
    background:radial-gradient(circle at 35% 35%, #fff7e0, #ffe6a1 55%, #f4c869 100%);
    box-shadow:0 0 46px 10px rgba(255,220,140,.35); z-index:0}
  .moon::after{content:""; position:absolute; top:-6px; right:-6px; width:66px;height:66px;
    border-radius:50%; background:#0e1330; box-shadow:0 0 30px 6px rgba(14,19,48,.6)}

  .wrap{position:relative; z-index:2; max-width:760px; margin:0 auto; padding:34px 20px 70px}
  header{text-align:center; margin-bottom:20px}
  h1{margin:.1em 0 .1em; font-size:2rem; letter-spacing:.3px}
  .sv{color:var(--gold); font-size:1rem; letter-spacing:2px; text-transform:uppercase; opacity:.85}
  .tag{color:var(--ink-dim); font-style:italic; margin-top:6px}

  /* language toggle */
  .langtoggle{display:inline-flex; gap:6px; margin-bottom:16px; padding:4px;
    border:1px solid var(--edge); border-radius:999px; background:rgba(255,255,255,.04)}
  .lang{cursor:pointer; user-select:none; font:inherit; font-size:.82rem; letter-spacing:.5px;
    padding:6px 15px; border-radius:999px; border:none; background:transparent; color:var(--ink-dim); transition:.15s}
  .lang.on{background:linear-gradient(180deg,#ffe6a1,#f4c869); color:#2a2050; font-weight:700}

  .panel{background:var(--card); border:1px solid var(--edge); border-radius:20px;
    padding:20px; backdrop-filter:blur(8px); box-shadow:0 20px 50px rgba(0,0,0,.35)}
  .controls{display:flex; flex-wrap:wrap; gap:14px; align-items:flex-end; justify-content:center; margin-bottom:18px}
  .field{display:flex; flex-direction:column; gap:6px}
  label{font-size:.72rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--ink-dim)}
  input[type=text]{background:rgba(255,255,255,.06); border:1px solid var(--edge); color:var(--ink);
    border-radius:12px; padding:10px 12px; font:inherit; font-size:1rem; width:230px}
  input::placeholder{color:#6f7c9e}
  .vibes{display:flex; gap:8px}
  .vibe{cursor:pointer; user-select:none; padding:9px 14px; border-radius:999px; font-size:.9rem;
    border:1px solid var(--edge); background:rgba(255,255,255,.04); color:var(--ink-dim); transition:.15s}
  .vibe.on{background:linear-gradient(180deg,#ffe6a1,#f4c869); color:#2a2050; border-color:transparent; font-weight:600}

  .btnrow{display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-top:4px}
  button.act{cursor:pointer; font:inherit; font-size:1.02rem; padding:13px 22px; border-radius:14px; border:none;
    background:linear-gradient(180deg,#ffd884,#f6b64a); color:#241a3d; font-weight:700; letter-spacing:.3px;
    box-shadow:0 8px 22px rgba(246,182,74,.28); transition:transform .12s, box-shadow .12s}
  button.act:hover{transform:translateY(-2px)}
  button.ghost{background:rgba(255,255,255,.06); color:var(--ink); box-shadow:none; border:1px solid var(--edge)}
  button:active{transform:translateY(1px)}

  .story{margin-top:22px; font-size:1.22rem; line-height:1.75; min-height:120px}
  .story p{margin:0 0 1em; opacity:0; transform:translateY(8px); animation:rise .7s ease forwards}
  .story p:nth-child(1){animation-delay:.05s}
  .story p:nth-child(2){animation-delay:.5s}
  .story p:nth-child(3){animation-delay:.95s}
  .story p:nth-child(4){animation-delay:1.4s}
  .story p:nth-child(5){animation-delay:1.85s}
  @keyframes rise{to{opacity:1; transform:none}}
  .title-line{font-size:1.5rem; color:var(--gold); font-weight:700; margin-bottom:.5em !important;
    animation:rise .7s ease forwards !important; opacity:0}
  em.name{color:var(--rose); font-style:normal; font-weight:600}
  .goodnight{margin-top:18px; padding-top:14px; border-top:1px dashed var(--edge);
    color:var(--ink-dim); font-style:italic; text-align:center}
  .goodnight b{color:var(--gold); font-style:normal}

  .footer{text-align:center; margin-top:26px; color:#7583a8; font-size:.82rem; line-height:1.5}
  .footer b{color:var(--gold)}
  .signature{margin-top:8px; color:var(--rose)}
</style>
</head>
<body>
<div id="sky"></div>
<div class="moon"></div>

<div class="wrap">
  <header>
    <div class="langtoggle" id="langtoggle">
      <button class="lang on" data-l="sv">Svenska</button>
      <button class="lang" data-l="en">English</button>
    </div>
    <div class="sv">Godnattsaga-maskin</div>
    <h1 id="h1">Godnattsaga-maskinen</h1>
    <div class="tag" id="tag"></div>
  </header>

  <div class="panel">
    <div class="controls">
      <div class="field">
        <label id="lbl-names"></label>
        <input id="names" type="text">
      </div>
      <div class="field">
        <label id="lbl-flavour"></label>
        <div class="vibes" id="vibes">
          <span class="vibe on" data-v="cozy" data-emoji="🫖"></span>
          <span class="vibe" data-v="silly" data-emoji="🐸"></span>
          <span class="vibe" data-v="brave" data-emoji="🛡️"></span>
        </div>
      </div>
    </div>

    <div class="btnrow">
      <button class="act" id="spin"></button>
      <button class="act ghost" id="more"></button>
    </div>

    <div class="story" id="story"></div>
  </div>

  <div class="footer">
    <div id="footer-main"></div>
    <div class="signature">God natt, Knut. 🌙</div>
  </div>
</div>

<script>
/* ---------- twinkly sky ---------- */
(function(){
  const sky=document.getElementById('sky'); let s='';
  for(let i=0;i<90;i++){
    const x=Math.random()*100, y=Math.random()*100, d=(2+Math.random()*5).toFixed(1);
    s+=`<span class="star" style="left:${x}%;top:${y}%;--d:${d}s;animation-delay:${(Math.random()*4).toFixed(1)}s"></span>`;
  }
  sky.innerHTML=s;
})();

/* ---------- machinery ---------- */
let lang="sv";
let vibe="cozy";
let moreCount=0;
let hasStory=false;

const VIBE_ORDER=["cozy","silly","brave"];

function C(){ return CONTENT[lang]; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function capFirst(s){ return s.charAt(0).toUpperCase()+s.slice(1); }

function getNames(){
  let raw=document.getElementById('names').value.trim();
  let arr = raw ? raw.split(',').map(s=>s.trim()).filter(Boolean) : DEFAULT_NAMES.slice();
  if(arr.length===0) arr=DEFAULT_NAMES.slice();
  return arr;
}
function joinNames(arr){
  const and = lang==="sv" ? " och " : " and ";
  if(arr.length===1) return arr[0];
  if(arr.length===2) return arr[0]+and+arr[1];
  // Swedish: no comma before "och"; English: Oxford comma before "and".
  const tail = lang==="sv" ? " och " : ", and ";
  return arr.slice(0,-1).join(", ")+tail+arr[arr.length-1];
}
function fill(t,namesStr,companion){
  return t.replaceAll("{names}",`<em class="name">${namesStr}</em>`)
          .replaceAll("{companion}",companion==null?"":companion);
}

function tellStory(){
  const c=C();
  const arr=getNames();
  const namesStr=joinNames(arr);
  const comp=pick(c.CO[vibe]);            // [full, short]
  const companionFull=comp[0], companionShort=comp[1];

  const title=pick(c.TITLES[vibe]);
  const p1=c.P1.replace("{place}",pick(c.PLACES)).replace("{companion}",companionFull);
  const p2=`${pick(c.PROBLEMS[vibe])} ${fill(pick(c.HELPS),namesStr)}`;
  const p3=`${fill(pick(c.TURNS),namesStr)} ${pick(c.RESOLVE)}`;
  const p4=capFirst(`${fill(pick(c.HOME),namesStr,companionShort)} ${pick(c.WINDDOWN)}`);
  const p5=`${fill(pick(c.CLOSE),namesStr)}`;

  const gn=pick(GOODNIGHTS);
  const langLabel=c.langnames[gn[1]];

  let html=`<p class="title-line">${title}</p>`;
  html+=`<p>${p1}</p>`;
  html+=`<p>${p2}</p>`;
  html+=`<p>${p3}</p>`;
  html+=`<p>${p4}</p>`;
  html+=`<p>${p5}</p>`;
  html+=`<div class="goodnight">${c.ui.gnClose(gn[0],langLabel)}</div>`;

  const box=document.getElementById('story');
  box.innerHTML=html;
  box.querySelectorAll('p').forEach(p=>{ p.style.animation='none'; void p.offsetWidth; p.style.animation=''; });
  hasStory=true;
}

function resetMore(){
  moreCount=0;
  const btn=document.getElementById('more');
  btn.textContent=C().ui.more.base;
  btn.disabled=false; btn.style.opacity=""; btn.style.cursor="pointer";
}

function showIntro(){
  document.getElementById('story').innerHTML=
    `<p style="opacity:.6;animation:none">${C().ui.intro}</p>`;
  hasStory=false;
}

/* ---------- apply a language to all chrome ---------- */
function applyLang(){
  const c=C(), u=c.ui;
  document.documentElement.lang=lang;
  document.getElementById('h1').textContent=u.h1;
  document.getElementById('tag').textContent=u.tag;
  document.getElementById('lbl-names').textContent=u.lblNames;
  document.getElementById('names').placeholder=u.placeholder;
  document.getElementById('lbl-flavour').textContent=u.lblFlavour;
  document.getElementById('spin').textContent=u.spin;
  document.getElementById('footer-main').innerHTML=u.footer;

  document.querySelectorAll('.vibe').forEach(v=>{
    const key=v.dataset.v;
    v.textContent=`${v.dataset.emoji} ${u.vibes[key]}`;
  });
  document.querySelectorAll('.lang').forEach(b=>b.classList.toggle('on',b.dataset.l===lang));

  resetMore();
  // Switching language always resets the story area so nothing is half-translated.
  showIntro();
}

/* ---------- events ---------- */
document.getElementById('langtoggle').addEventListener('click',e=>{
  const t=e.target.closest('.lang'); if(!t) return;
  if(t.dataset.l===lang) return;
  lang=t.dataset.l;
  applyLang();
});

document.getElementById('vibes').addEventListener('click',e=>{
  const t=e.target.closest('.vibe'); if(!t)return;
  document.querySelectorAll('.vibe').forEach(v=>v.classList.remove('on'));
  t.classList.add('on'); vibe=t.dataset.v;
});

document.getElementById('spin').addEventListener('click',()=>{ resetMore(); tellStory(); });

/* The one surprise: the machine knows when to stop. */
document.getElementById('more').addEventListener('click',()=>{
  const u=C().ui;
  moreCount++;
  const btn=document.getElementById('more');
  if(moreCount<3){
    tellStory();
    btn.textContent = moreCount===1 ? u.more.after1 : u.more.after2;
  } else if(moreCount===3){
    tellStory();
    btn.textContent = u.more.final;
    btn.disabled=true; btn.style.opacity=".55"; btn.style.cursor="default";
    const box=document.getElementById('story');
    const note=document.createElement('div');
    note.className='goodnight';
    note.style.marginTop='10px';
    note.innerHTML=`<i>${u.powerdown}</i>`;
    box.appendChild(note);
  }
});

/* ---------- boot (Swedish by default) ---------- */
applyLang();
</script>
</body>
</html>
