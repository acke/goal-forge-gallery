<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Markdown Diff Dissector</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #e2e8f0;
            min-height: 100vh;
            padding: 2rem;
            line-height: 1.6;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 2rem;
        }
        
        h1 {
            font-size: 2rem;
            margin-bottom: 0.5rem;
            background: linear-gradient(120deg, #60a5fa, #34d399);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        
        .subtitle {
            color: #94a3b8;
            font-size: 0.95rem;
        }
        
        .workspace {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .editor-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .editor-header {
            background: #0f172a;
            padding: 1rem;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #cbd5e1;
        }
        
        textarea {
            flex: 1;
            background: #1e293b;
            color: #e2e8f0;
            border: none;
            padding: 1rem;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 0.9rem;
            resize: none;
            line-height: 1.5;
        }
        
        textarea::placeholder {
            color: #64748b;
        }
        
        textarea:focus {
            outline: none;
            background: #1e293b;
        }
        
        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            align-items: center;
        }
        
        button {
            background: linear-gradient(120deg, #3b82f6, #1d4ed8);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.95rem;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 16px rgba(59, 130, 246, 0.3);
        }
        
        button:active {
            transform: translateY(0);
        }
        
        .stats-banner {
            background: linear-gradient(120deg, #1e293b, #0f172a);
            border: 1px solid #334155;
            border-radius: 0.5rem;
            padding: 1rem;
            display: flex;
            gap: 2rem;
            align-items: center;
            flex-wrap: wrap;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 0.9rem;
        }
        
        .stat-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        
        .stat-label {
            color: #94a3b8;
        }
        
        .stat-value {
            font-weight: 600;
        }
        
        .added {
            color: #34d399;
        }
        
        .removed {
            color: #f87171;
        }
        
        .neutral {
            color: #60a5fa;
        }
        
        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }
        
        .result-panel {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 0.75rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        
        .result-header {
            background: #0f172a;
            padding: 1rem;
            border-bottom: 1px solid #334155;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #cbd5e1;
        }
        
        .result-content {
            overflow-y: auto;
            max-height: 400px;
            padding: 1rem;
            font-family: "Monaco", "Courier New", monospace;
            font-size: 0.85rem;
            line-height: 1.6;
        }
        
        .diff-line {
            display: flex;
            padding: 0.25rem 0.5rem;
            margin-bottom: 0.25rem;
            border-radius: 0.25rem;
            position: relative;
        }
        
        .diff-line.added {
            background: rgba(52, 211, 153, 0.1);
            color: #86efac;
        }
        
        .diff-line.removed {
            background: rgba(248, 113, 113, 0.1);
            color: #fca5a5;
        }
        
        .diff-line.context {
            background: rgba(148, 163, 184, 0.05);
            color: #cbd5e1;
        }
        
        .diff-marker {
            display: inline-block;
            width: 1.5rem;
            color: inherit;
            opacity: 0.6;
            font-weight: 600;
        }
        
        .structure-item {
            padding: 0.5rem 0.75rem;
            margin-bottom: 0.5rem;
            background: rgba(59, 130, 246, 0.1);
            border-left: 3px solid #3b82f6;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }
        
        .structure-item.heading {
            border-left-color: #ec4899;
            background: rgba(236, 72, 153, 0.1);
        }
        
        .structure-item.list {
            border-left-color: #f59e0b;
            background: rgba(245, 158, 11, 0.1);
        }
        
        .structure-item.code {
            border-left-color: #10b981;
            background: rgba(16, 185, 129, 0.1);
        }
        
        .structure-item.link {
            border-left-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }
        
        .structure-label {
            display: inline-block;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            margin-right: 0.5rem;
            opacity: 0.8;
        }
        
        .structure-content {
            word-break: break-word;
        }
        
        .tabs {
            display: flex;
            border-bottom: 1px solid #334155;
            gap: 0;
        }
        
        .tab {
            flex: 1;
            padding: 0.75rem 1rem;
            background: transparent;
            border: none;
            color: #94a3b8;
            font-weight: 600;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            cursor: pointer;
            transition: all 0.2s;
            border-bottom: 2px solid transparent;
            margin-bottom: -1px;
        }
        
        .tab.active {
            color: #60a5fa;
            border-bottom-color: #60a5fa;
            background: rgba(96, 165, 250, 0.05);
        }
        
        .tab-content {
            display: none;
        }
        
        .tab-content.active {
            display: block;
        }
        
        @media (max-width: 1024px) {
            .workspace, .results {
                grid-template-columns: 1fr;
            }
        }
        
        .empty-state {
            color: #64748b;
            text-align: center;
            padding: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>The Markdown Diff Dissector</h1>
            <p class="subtitle">Paste two markdown versions. Watch structure change come alive.</p>
        </header>
        
        <div class="workspace">
            <div class="editor-panel">
                <div class="editor-header">Before</div>
                <textarea id="before" placeholder="Paste the original markdown here..."></textarea>
            </div>
            <div class="editor-panel">
                <div class="editor-header">After</div>
                <textarea id="after" placeholder="Paste the updated markdown here..."></textarea>
            </div>
        </div>
        
        <div class="controls">
            <button onclick="runDiff()">📊 Dissect</button>
            <button onclick="clearAll()">🗑️ Clear</button>
            <button onclick="swapPanels()">🔄 Swap</button>
            <button onclick="loadExamples()">📚 Examples</button>
        </div>
        
        <div class="stats-banner" id="stats" style="display: none;">
            <div class="stat-item">
                <span class="stat-label">Lines:</span>
                <span class="stat-value neutral" id="statLines">0 → 0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label added">+</span>
                <span class="stat-value added" id="statAdded">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label removed">−</span>
                <span class="stat-value removed" id="statRemoved">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Headings changed:</span>
                <span class="stat-value neutral" id="statHeadings">0</span>
            </div>
            <div class="stat-item">
                <span class="stat-label">Blocks touched:</span>
                <span class="stat-value neutral" id="statBlocks">0</span>
            </div>
        </div>
        
        <div class="results" id="results" style="display: none;">
            <div class="result-panel">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('diff', 0)">Diff</button>
                    <button class="tab" onclick="switchTab('structure', 0)">Structure</button>
                </div>
                <div class="result-content">
                    <div id="diff-content" class="tab-content active"></div>
                    <div id="structure-content" class="tab-content"></div>
                </div>
            </div>
            <div class="result-panel">
                <div class="tabs">
                    <button class="tab active" onclick="switchTab('changes', 1)">What Changed</button>
                </div>
                <div class="result-content">
                    <div id="changes-content" class="tab-content active"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function runDiff() {
            const before = document.getElementById('before').value;
            const after = document.getElementById('after').value;
            
            if (!before.trim() || !after.trim()) {
                alert('Paste both versions first.');
                return;
            }
            
            const beforeLines = before.split('\n');
            const afterLines = after.split('\n');
            
            // Simple Myers' diff
            const diff = computeDiff(beforeLines, afterLines);
            
            // Parse structure
            const beforeStruct = parseMarkdownStructure(beforeLines);
            const afterStruct = parseMarkdownStructure(afterLines);
            
            // Render
            renderDiff(diff, beforeLines, afterLines);
            renderStructure(beforeStruct, afterStruct);
            renderChanges(beforeStruct, afterStruct);
            renderStats(beforeLines, afterLines, diff);
            
            document.getElementById('results').style.display = 'grid';
            document.getElementById('stats').style.display = 'flex';
        }
        
        function computeDiff(before, after) {
            const diff = [];
            let i = 0, j = 0;
            
            // Simplified longest common subsequence
            while (i < before.length || j < after.length) {
                if (i >= before.length) {
                    diff.push({ type: 'add', line: after[j], index: j });
                    j++;
                } else if (j >= after.length) {
                    diff.push({ type: 'remove', line: before[i], index: i });
                    i++;
                } else if (before[i] === after[j]) {
                    diff.push({ type: 'context', line: before[i], index: i });
                    i++; j++;
                } else {
                    // Look ahead for matching lines
                    let foundAfter = -1, foundBefore = -1;
                    for (let k = j + 1; k < Math.min(j + 5, after.length); k++) {
                        if (before[i] === after[k]) { foundAfter = k; break; }
                    }
                    for (let k = i + 1; k < Math.min(i + 5, before.length); k++) {
                        if (before[k] === after[j]) { foundBefore = k; break; }
                    }
                    
                    if (foundAfter >= 0 && (foundBefore < 0 || foundAfter - j <= foundBefore - i)) {
                        while (j < foundAfter) {
                            diff.push({ type: 'add', line: after[j], index: j });
                            j++;
                        }
                    } else if (foundBefore >= 0) {
                        while (i < foundBefore) {
                            diff.push({ type: 'remove', line: before[i], index: i });
                            i++;
                        }
                    } else {
                        diff.push({ type: 'remove', line: before[i], index: i });
                        diff.push({ type: 'add', line: after[j], index: j });
                        i++; j++;
                    }
                }
            }
            return diff;
        }
        
        function parseMarkdownStructure(lines) {
            const structure = {
                headings: [],
                lists: [],
                codeBlocks: [],
                links: [],
                images: []
            };
            
            let inCodeBlock = false;
            for (let i = 0; i < lines.length; i++) {
                const line = lines[i];
                
                if (line.trim().startsWith('```')) {
                    inCodeBlock = !inCodeBlock;
                    if (inCodeBlock) structure.codeBlocks.push({ line: i, type: 'open' });
                    else structure.codeBlocks.push({ line: i, type: 'close' });
                } else if (!inCodeBlock) {
                    if (/^#+\s/.test(line)) {
                        const level = line.match(/^#+/)[0].length;
                        structure.headings.push({ line: i, level, text: line });
                    }
                    if (/^\s*[-*+]\s/.test(line) || /^\s*\d+\.\s/.test(line)) {
                        structure.lists.push({ line: i, text: line });
                    }
                    if (/\[.+\]\(.+\)/.test(line)) {
                        structure.links.push({ line: i, text: line });
                    }
                    if (/!\[.+\]\(.+\)/.test(line)) {
                        structure.images.push({ line: i, text: line });
                    }
                }
            }
            return structure;
        }
        
        function renderDiff(diff, before, after) {
            let html = '';
            const maxContext = 1;
            let lastLine = -10;
            
            for (let i = 0; i < diff.length; i++) {
                const d = diff[i];
                if (i > 0 && d.index - lastLine > maxContext + 1) {
                    html += '<div class="diff-line context" style="opacity: 0.4;">⋯⋯⋯</div>';
                }
                
                const marker = d.type === 'add' ? '+' : d.type === 'remove' ? '−' : ' ';
                const cls = d.type === 'add' ? 'added' : d.type === 'remove' ? 'removed' : 'context';
                html += `<div class="diff-line ${cls}"><span class="diff-marker">${marker}</span><span>${escapeHtml(d.line)}</span></div>`;
                lastLine = d.index;
            }
            
            document.getElementById('diff-content').innerHTML = html;
        }
        
        function renderStructure(before, after) {
            let html = '<div style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 1rem;">Structure Breakdown</div>';
            
            if (before.headings.length > 0 || after.headings.length > 0) {
                html += '<div style="margin-bottom: 0.5rem;"><strong style="color: #ec4899;">Headings</strong></div>';
                const beforeHeadings = new Set(before.headings.map(h => h.text));
                const afterHeadings = new Set(after.headings.map(h => h.text));
                
                for (const h of after.headings) {
                    const status = beforeHeadings.has(h.text) ? '=' : '+';
                    html += `<div class="structure-item heading"><span class="structure-label">${status}</span><span class="structure-content">${'#'.repeat(h.level)} ${h.text.replace(/^#+\s/, '')}</span></div>`;
                }
            }
            
            if (after.codeBlocks.length > 0) {
                html += '<div style="margin: 1rem 0 0.5rem; margin-top: 1rem;"><strong style="color: #10b981;">Code Blocks</strong></div>';
                html += `<div class="structure-item code"><span class="structure-label">count</span><span class="structure-content">${after.codeBlocks.filter(c => c.type === 'open').length} blocks</span></div>`;
            }
            
            if (after.links.length > 0) {
                html += '<div style="margin: 1rem 0 0.5rem;"><strong style="color: #8b5cf6;">Links</strong></div>';
                for (const l of after.links.slice(0, 3)) {
                    const text = l.text.match(/\[(.+?)\]/)?.[1] || '(link)';
                    html += `<div class="structure-item link"><span class="structure-label">href</span><span class="structure-content">${escapeHtml(text)}</span></div>`;
                }
                if (after.links.length > 3) {
                    html += `<div style="color: #64748b; padding: 0.25rem; font-size: 0.75rem;">... and ${after.links.length - 3} more</div>`;
                }
            }
            
            document.getElementById('structure-content').innerHTML = html;
        }
        
        function renderChanges(before, after) {
            let html = '';
            
            const beforeHeadings = new Set(before.headings.map(h => h.text));
            const afterHeadings = new Set(after.headings.map(h => h.text));
            const newHeadings = [...afterHeadings].filter(h => !beforeHeadings.has(h));
            const removedHeadings = [...beforeHeadings].filter(h => !afterHeadings.has(h));
            
            if (newHeadings.length > 0) {
                html += '<div style="margin-bottom: 1rem;"><div style="color: #34d399; font-weight: 600; margin-bottom: 0.5rem;">+ New Headings</div>';
                for (const h of newHeadings) {
                    html += `<div style="padding: 0.5rem; background: rgba(52, 211, 153, 0.05); border-left: 2px solid #34d399; border-radius: 0.25rem; margin-bottom: 0.5rem;">${escapeHtml(h)}</div>`;
                }
                html += '</div>';
            }
            
            if (removedHeadings.length > 0) {
                html += '<div style="margin-bottom: 1rem;"><div style="color: #f87171; font-weight: 600; margin-bottom: 0.5rem;">− Removed Headings</div>';
                for (const h of removedHeadings) {
                    html += `<div style="padding: 0.5rem; background: rgba(248, 113, 113, 0.05); border-left: 2px solid #f87171; border-radius: 0.25rem; margin-bottom: 0.5rem;">${escapeHtml(h)}</div>`;
                }
                html += '</div>';
            }
            
            const beforeListCount = before.lists.length;
            const afterListCount = after.lists.length;
            if (beforeListCount !== afterListCount) {
                html += `<div style="padding: 0.75rem; background: rgba(96, 165, 250, 0.1); border-left: 2px solid #60a5fa; border-radius: 0.25rem; margin-bottom: 0.5rem;">📋 List items: <strong>${beforeListCount}</strong> → <strong>${afterListCount}</strong></div>`;
            }
            
            const beforeCodeCount = before.codeBlocks.filter(c => c.type === 'open').length;
            const afterCodeCount = after.codeBlocks.filter(c => c.type === 'open').length;
            if (beforeCodeCount !== afterCodeCount) {
                html += `<div style="padding: 0.75rem; background: rgba(16, 185, 129, 0.1); border-left: 2px solid #10b981; border-radius: 0.25rem; margin-bottom: 0.5rem;">💾 Code blocks: <strong>${beforeCodeCount}</strong> → <strong>${afterCodeCount}</strong></div>`;
            }
            
            if (html === '') {
                html = '<div class="empty-state">No structural changes detected.</div>';
            }
            
            document.getElementById('changes-content').innerHTML = html;
        }
        
        function renderStats(before, after, diff) {
            const added = diff.filter(d => d.type === 'add').length;
            const removed = diff.filter(d => d.type === 'remove').length;
            
            const beforeStruct = parseMarkdownStructure(before);
            const afterStruct = parseMarkdownStructure(after);
            const headingsChanged = new Set([
                ...beforeStruct.headings.map(h => h.text),
                ...afterStruct.headings.map(h => h.text)
            ]).size;
            
            document.getElementById('statLines').textContent = `${before.length} → ${after.length}`;
            document.getElementById('statAdded').textContent = added;
            document.getElementById('statRemoved').textContent = removed;
            document.getElementById('statHeadings').textContent = afterStruct.headings.length;
            document.getElementById('statBlocks').textContent = (afterStruct.codeBlocks.filter(c => c.type === 'open').length + afterStruct.lists.length + afterStruct.links.length);
        }
        
        function switchTab(name, panelIndex) {
            const panels = document.querySelectorAll('.result-panel');
            const panel = panels[panelIndex];
            const tabs = panel.querySelectorAll('.tab');
            const contents = panel.querySelectorAll('.tab-content');
            
            tabs.forEach((t, i) => {
                t.classList.remove('active');
                contents[i].classList.remove('active');
            });
            
            const tabIndex = name === 'diff' || name === 'changes' ? 0 : 1;
            tabs[tabIndex].classList.add('active');
            contents[tabIndex].classList.add('active');
        }
        
        function clearAll() {
            document.getElementById('before').value = '';
            document.getElementById('after').value = '';
            document.getElementById('results').style.display = 'none';
            document.getElementById('stats').style.display = 'none';
            document.getElementById('before').focus();
        }
        
        function swapPanels() {
            const before = document.getElementById('before').value;
            const after = document.getElementById('after').value;
            document.getElementById('before').value = after;
            document.getElementById('after').value = before;
        }
        
        function loadExamples() {
            document.getElementById('before').value = `# Getting Started

Welcome to the project.

## Installation

Run npm install.

\`\`\`bash
npm install
\`\`\`

## Features

- Fast
- Reliable
`;
            document.getElementById('after').value = `# Getting Started

Welcome to the new project.

## Installation

Follow the [quick start guide](https://example.com).

\`\`\`bash
npm install
npm run dev
\`\`\`

## Features

- Fast and efficient
- Reliable
- Extensible

## Configuration

See config.json for details.
`;
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
